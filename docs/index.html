<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ซอมบี้สวนยาง</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=K2D:wght@600;800&family=Sarabun:wght@400;600&display=swap">
<style>
:root{color-scheme:dark;--ink:#e8f0ea;--mut:#9fb3a6;--blood:#d2452b;--amber:#f0b44a;--panel:rgba(8,14,12,.88)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#070b0d;color:var(--ink);font:400 16px/1.5 Sarabun,Tahoma,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#pad{position:fixed;inset:0;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font:800 18px K2D,Tahoma,sans-serif;text-shadow:0 1px 4px #000}
.hud small{display:block;font:400 13px Sarabun,Tahoma,sans-serif;color:var(--mut)}
.hpw{width:130px;height:12px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid #ffffff33;overflow:hidden;margin-top:4px}
.hpw.sp{height:6px;width:110px;margin-top:3px}
#hp{height:100%;width:100%;background:var(--blood);transition:width .2s}
#sp{height:100%;width:100%;background:#7ac36a}
#am{color:var(--amber);text-align:right}
#rd{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);width:90px;height:90px;pointer-events:none}
#cx{position:fixed;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;pointer-events:none}
#cx:before,#cx:after{content:"";position:absolute;background:#fff;opacity:.85;box-shadow:0 0 2px #000}
#cx:before{left:5.5px;top:0;width:1px;height:12px}#cx:after{top:5.5px;left:0;height:1px;width:12px}
#cx.hit:before,#cx.hit:after{background:var(--blood);opacity:1}
#dmg{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(transparent 40%,rgba(190,20,10,.8))}
#bn{position:fixed;left:0;right:0;top:24%;text-align:center;font:800 34px K2D,Tahoma,sans-serif;pointer-events:none;opacity:0;transition:opacity .4s;text-shadow:0 2px 10px #000}
.btn{position:fixed;border-radius:50%;border:2px solid #ffffff55;background:rgba(210,69,43,.55);color:#fff;font:800 16px K2D,Tahoma,sans-serif;touch-action:none;display:none;align-items:center;justify-content:center;padding:0}
#fb{right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:92px;height:92px}
#rb{right:calc(env(safe-area-inset-right,0px) + 126px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:58px;height:58px;background:rgba(40,60,50,.6);font-size:13px}
#jp{right:calc(env(safe-area-inset-right,0px) + 28px);bottom:calc(env(safe-area-inset-bottom,0px) + 146px);width:66px;height:66px;background:rgba(40,90,140,.65);font-size:13px}
#cr{right:calc(env(safe-area-inset-right,0px) + 108px);bottom:calc(env(safe-area-inset-bottom,0px) + 108px);width:58px;height:58px;background:rgba(40,60,50,.6);font-size:13px}
#sb{left:calc(env(safe-area-inset-left,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:64px;height:64px;background:rgba(60,120,60,.6);font-size:13px}
#vb{left:calc(env(safe-area-inset-left,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 228px);width:56px;height:56px;background:rgba(60,60,110,.65);font-size:12px}
#cr.on,#sb.on,#vb.on{background:rgba(240,180,74,.85);color:#000}
body.t .btn{display:flex}
#jb,#jk{position:fixed;border-radius:50%;pointer-events:none;display:none}
#jb{width:100px;height:100px;border:2px solid #ffffff44;margin:-50px 0 0 -50px}
#jk{width:44px;height:44px;background:#ffffff55;margin:-22px 0 0 -22px}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,8,7,.82);padding:20px;z-index:8}
#ov .box{max-width:380px;background:var(--panel);border:1px solid #ffffff22;border-radius:16px;padding:24px;text-align:center}
#ov h1{font:800 34px/1.15 K2D,Tahoma,sans-serif;margin:0 0 8px;color:var(--blood)}
#ov p{margin:0 0 16px;color:var(--mut)}
#ov button,#start{font:800 20px K2D,Tahoma,sans-serif;padding:12px 26px;border-radius:12px;border:0;background:var(--blood);color:#fff;margin:4px}
#ov button.alt{background:#2a3a34}
/* lobby */
#lobby{position:fixed;inset:0;display:flex;flex-direction:column;background:#050a0b;z-index:5}
body:not(.lb) #lobby{display:none}
body.lb .hud,body.lb #cx,body.lb .btn,body.lb #rd,body.lb #pad,body.lb #c{display:none!important}
.lt{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:baseline;font:800 26px K2D,Tahoma,sans-serif;color:var(--blood);text-shadow:0 2px 8px #000}
.lt small{font:400 13px Sarabun,Tahoma,sans-serif;color:var(--mut)}
#lw{position:relative;flex:1;min-height:0}
#lc{position:absolute;inset:0;width:100%;height:100%}
#sw{position:absolute;left:14px;top:10px;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
#sw i{width:28px;height:28px;border-radius:50%;border:2px solid #fff4;display:block}
#sw i.on{border-color:var(--amber);box-shadow:0 0 0 2px #0008}
#ws{position:absolute;right:12px;top:10px;width:158px;background:rgba(0,0,0,.5);border:1px solid #ffffff1a;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.35}
#ws b{font:800 15px K2D,Tahoma,sans-serif;color:var(--amber)}
#ws small{color:var(--mut);display:block;margin:2px 0 6px}
.bar{height:6px;background:#ffffff22;border-radius:3px;margin:2px 0 6px}
.bar i{display:block;height:100%;background:var(--amber);border-radius:3px}
#wl{display:flex;gap:10px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
#wl::-webkit-scrollbar{display:none}
.wc{flex:0 0 138px;border:2px solid #ffffff22;border-radius:12px;background:#0b1412;padding:6px 8px;text-align:center}
.wc canvas{width:100%;height:auto;display:block}
.wc b{display:block;font:800 14px K2D,Tahoma,sans-serif}
.wc small{color:var(--mut);font-size:12px}
.wc.on{border-color:var(--amber);background:#1a1710}
#start{display:block;margin:4px 14px calc(env(safe-area-inset-bottom,0px) + 14px);padding:14px;font-size:22px}

/* progression */
#qb,#eb{font:600 12px Sarabun,Tahoma,sans-serif;padding:3px 9px;border-radius:8px;border:1px solid #ffffff33;background:#14201c;color:var(--ink);margin-right:8px}
#hb{right:calc(env(safe-area-inset-right,0px) + 194px);bottom:calc(env(safe-area-inset-bottom,0px) + 54px);width:62px;height:62px;background:rgba(40,130,70,.65);font-size:12px;line-height:1.15}
#bg{left:calc(env(safe-area-inset-left,0px) + 100px);bottom:calc(env(safe-area-inset-bottom,0px) + 160px);width:56px;height:56px;background:rgba(110,80,40,.65);font-size:12px}
#hb.on{background:rgba(240,180,74,.85);color:#000}
#dv{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);margin-left:-60px;width:120px;height:120px;background:rgba(240,180,74,.93);color:#000;font-size:22px;display:none!important;animation:dvp 1s infinite}
@keyframes dvp{50%{box-shadow:0 0 0 14px rgba(240,180,74,.25)}}
body.a1 .btn,body.a2 .btn{display:none!important}
body.a1 .hud,body.a1 #rd,body.a1 #cx,body.a2 #cx,body.a2 #rd{display:none!important}
body.a1.jr #dv{display:flex!important}
#bag{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,8,7,.86);padding:20px;z-index:9}
#bag .box{width:100%;max-width:340px;background:var(--panel);border:1px solid #ffffff22;border-radius:16px;padding:16px}
#bag h2{font:800 22px K2D,Tahoma,sans-serif;margin:0 0 8px;color:var(--amber);text-align:center}
.bi{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff12}.bi div{flex:1}.bi small{display:block;color:var(--mut);font-size:12px}
.bi button{font:800 14px K2D,Tahoma,sans-serif;padding:6px 16px;border-radius:8px;border:0;background:#2e7d4a;color:#fff}.bi button:disabled{background:#2a3a34;color:var(--mut)}
#bgc{margin-top:12px;width:100%;font:800 18px K2D,Tahoma,sans-serif;padding:10px;border-radius:12px;border:0;background:var(--blood);color:#fff}
.btn{opacity:var(--bo,1)}body:not(.t) #eb{display:none}
#ed,#edt{display:none}
body.ed #ed{display:block;position:fixed;inset:0;z-index:6;background:rgba(5,9,9,.94);background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:40px 40px}
body.ed .btn{display:flex!important;z-index:7;pointer-events:auto}
body.ed .hud,body.ed #rd,body.ed #cx,body.ed #dmg,body.ed #pad{display:none!important}
.btn.sel{outline:3px dashed var(--amber);outline-offset:3px}
body.ed #edt{display:flex;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);z-index:8;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:var(--panel);border:1px solid #ffffff22;border-radius:12px;padding:8px 12px;width:max-content;max-width:calc(100% - 24px);font-size:13px}
#edt label{display:flex;gap:6px;align-items:center;color:var(--mut)}#edt input{width:96px}
#edt button{font:800 14px K2D,Tahoma,sans-serif;padding:6px 12px;border-radius:8px;border:0;background:#2a3a34;color:var(--ink)}#edt #edd{background:var(--blood);color:#fff}
#edn{width:100%;text-align:center;color:var(--amber)}
.hud{padding-left:calc(env(safe-area-inset-left,0px) + 14px);padding-right:calc(env(safe-area-inset-right,0px) + 14px)}
#rd{right:calc(env(safe-area-inset-right,0px) + 12px)}
@media (orientation:landscape) and (max-height:560px){
 #lobby{display:grid;grid-template-columns:1fr 236px;grid-template-rows:auto 1fr auto}
 .lt{grid-column:1;grid-row:1;padding-left:calc(env(safe-area-inset-left,0px) + 16px);font-size:22px}
 #lw{grid-column:1;grid-row:2/4}
 #sw{left:calc(env(safe-area-inset-left,0px) + 14px)}
 #pf{left:calc(env(safe-area-inset-left,0px) + 14px);top:46px}
 #wl{grid-column:2;grid-row:1/3;flex-direction:column;overflow-x:hidden;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 12px) 8px 6px;gap:6px}
 .wc{flex:0 0 auto;display:flex;align-items:center;gap:8px;text-align:left;padding:4px 8px}
 .wc canvas{width:92px;flex:0 0 92px}
 #start{grid-column:2;grid-row:3;margin:4px calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 10px) 6px;padding:10px;font-size:20px}
}
@media (max-height:500px){#ov .box,#rw .box{padding:12px;max-height:94vh;overflow:auto}#ov h1{font-size:26px}#ov p{margin-bottom:8px}}
#xb{height:100%;width:0;background:#5aa9e6}
#pf{position:absolute;left:14px;top:48px;width:178px;background:rgba(0,0,0,.5);border:1px solid #ffffff1a;border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#pf .bd{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 17px K2D,Tahoma,sans-serif;color:#000;border:2px solid #fff6;flex:0 0 auto}
#pf .pi{flex:1;min-width:0}#pf .pi b{font:800 13px/1.2 K2D,Tahoma,sans-serif;display:block}#pf .pi small{font-size:11px;color:var(--mut)}
#pf .bar{margin:3px 0}
#rwb{width:100%;font:800 14px K2D,Tahoma,sans-serif;padding:5px;border-radius:8px;border:0;background:#2a3a34;color:var(--ink)}
.wc.lock{opacity:.45}#sw i.lk{opacity:.3}
#toast{position:absolute;left:50%;top:36%;transform:translateX(-50%);background:rgba(0,0,0,.78);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:3}
#rw{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,8,7,.86);padding:20px;z-index:9}
#rw .box{width:100%;max-width:380px;max-height:80vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid #ffffff22;border-radius:16px;padding:18px}
#rw h2{font:800 22px K2D,Tahoma,sans-serif;margin:0 0 8px;color:var(--amber);text-align:center}
#rwl{overflow-y:auto;text-align:left}
.rr{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #ffffff12;color:var(--mut);font-size:14px}
.rr span:first-child{width:46px;font:800 14px K2D,Tahoma,sans-serif}.rr span:nth-child(2){flex:1}
.rr.ok{color:var(--ink)}.rr.ok span:last-child{color:#7ac36a}
#rwc{margin-top:10px;font:800 18px K2D,Tahoma,sans-serif;padding:10px;border-radius:12px;border:0;background:var(--blood);color:#fff}
#ovX{margin:0 0 14px}.xr{margin:6px 0;color:var(--ink);font-size:15px}.xr b{color:#5aa9e6;font:800 20px K2D,Tahoma,sans-serif}
#ub{display:none!important;right:calc(env(safe-area-inset-right,0px) + 118px);bottom:calc(env(safe-area-inset-bottom,0px) + 184px);width:78px;height:78px;background:rgba(240,180,74,.9);color:#000;font-size:14px;line-height:1.1;text-align:center}
#ub.show{display:flex!important}
</style>
</head>
<body class="lb">
<canvas id="c"></canvas>
<div id="pad"></div>
<div class="hud">
  <div>เลือด<div class="hpw"><div id="hp"></div></div><div class="hpw sp"><div id="sp"></div></div><div class="hpw sp" style="height:4px"><div id="xb"></div></div><small id="st"></small></div>
  <div id="am"><span id="amt"></span><small id="wn"></small></div>
</div>
<canvas id="rd" width="180" height="180"></canvas>
<div id="cx"></div>
<div id="dmg"></div>
<div id="bn"></div>
<div id="jb"></div><div id="jk"></div>
<div id="ed"></div>
<div id="edt"><span id="edn"></span><label>ขนาด <input type="range" id="eds" min="60" max="160" value="100"></label><label>ความโปร่ง <input type="range" id="edo" min="30" max="100" value="100"></label><button id="edr">รีเซ็ตแนวนี้</button><button id="edd">เสร็จ</button></div>
<button class="btn" id="fb">ยิง</button>
<button class="btn" id="rb">รีโหลด</button>
<button class="btn" id="jp">กระโดด</button>
<button class="btn" id="cr">นั่ง</button>
<button class="btn" id="sb">วิ่ง</button>
<button class="btn" id="vb">บุคคล 1</button>
<button class="btn" id="hb">พันยา</button>
<button class="btn" id="bg">กระเป๋า</button>
<button class="btn" id="dv">โดดร่ม</button>
<button class="btn" id="ub"></button>

<div id="lobby">
  <div class="lt"><span>ซอมบี้สวนยาง</span><span><button id="eb">ปรับปุ่ม</button><button id="qb"></button><small id="lbs"></small></span></div>
  <div id="lw">
    <canvas id="lc"></canvas>
    <div id="sw"></div>
    <div id="ws"></div>
    <div id="pf"></div>
    <div id="toast"></div>
  </div>
  <div id="wl"></div>
  <div id="net" style="margin:6px 14px;font-size:14px">
    <div id="nroom" style="font:800 18px K2D,Tahoma,sans-serif;color:var(--amber)"></div>
    <div id="nst" style="color:var(--mut)">ออนไลน์: สร้างห้องหรือกรอกรหัสเพื่อนเพื่อเล่นร่วมกัน</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px">
      <button id="ncr" style="font:800 15px K2D,Tahoma,sans-serif;padding:6px 12px;border-radius:8px;border:0;background:#2e7d4a;color:#fff">สร้างห้อง</button>
      <input id="nci" placeholder="รหัส 4 หลัก" inputmode="numeric" maxlength="4" style="width:120px;padding:6px;border-radius:8px;border:1px solid #ffffff33;background:#14201c;color:var(--ink)">
      <button id="nj" style="font:800 15px K2D,Tahoma,sans-serif;padding:6px 12px;border-radius:8px;border:0;background:#2a3a34;color:var(--ink)">เข้าห้อง</button>
    </div>
  </div>
  <button id="start">เริ่มภารกิจ</button>
</div>

<div id="ov"><div class="box">
  <h1 id="ovT">คุณตายแล้ว</h1>
  <p id="ovP"></p><div id="ovX"></div>
  <button id="again">เล่นใหม่</button><button id="tolobby" class="alt">กลับล็อบบี้</button>
</div></div>

<div id="bag"><div class="box"><h2>กระเป๋า</h2><div id="bgl"></div><button id="bgc">ปิด (เล่นต่อ)</button></div></div>
<div id="rw"><div class="box"><h2>รางวัลและยศ</h2><div id="rwl"></div><button id="rwc">ปิด</button></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const rgb=a=>'rgb('+a[0]+','+a[1]+','+a[2]+')';
const cv=$('c'),g=cv.getContext('2d');
const lc=$('lc'),lg=lc.getContext('2d');
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(TOUCH)document.body.classList.add('t');
/* คุณภาพกราฟิก: 0 ต่ำ / 1 กลาง / 2 สูง */
let QL=1,QV=1,QP=1,QF=0;
function setQ(n){QL=n;QV=[.55,.8,1][n];QP=[.4,.7,1][n];QF=n?0:33;try{localStorage.setItem('zr_q',n)}catch(e){}const b=$('qb');if(b)b.textContent='กราฟิก: '+['ต่ำ','กลาง','สูง'][n]}
{let n=-1;try{n=parseInt(localStorage.getItem('zr_q'))}catch(e){}if(!(n>=0&&n<=2))n=((navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||4)<=3)?0:1;setQ(n)}
$('qb').onclick=()=>{setQ((QL+1)%3);rs()};
let W=0,H=0,F=1,hor=0,camh=1.65,SN=0,CS=1,DPR=1,lw_=0,lh_=0;
function sizeLobby(){const w=$('lw');if(!w)return;lw_=w.clientWidth;lh_=w.clientHeight;lc.width=Math.max(1,lw_*DPR);lc.height=Math.max(1,lh_*DPR)}
function rs(){DPR=Math.min(devicePixelRatio||1,[.7,1,2][QL]);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);F=Math.min(W,H)*(W>H?1.05:1);sizeLobby()}
addEventListener('resize',rs);rs();
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= helpers ================= */
const FOG=[20,41,46];
const fogT=d=>Math.pow(clamp((d-4)/52,0,1),.85);
function mx(c,t,fl){fl=fl||0;const r=c[0]+(FOG[0]-c[0])*t+110*fl,gg=c[1]+(FOG[1]-c[1])*t+110*fl,b=c[2]+(FOG[2]-c[2])*t+110*fl;return'rgb('+(clamp(r,0,255)|0)+','+(clamp(gg,0,255)|0)+','+(clamp(b,0,255)|0)+')'}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function poly(c,p,f,s,lw){c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();if(f){c.fillStyle=f;c.fill()}if(s){c.strokeStyle=s;c.lineWidth=lw||.7;c.stroke()}}
function rr(c,x,y,w,h,r,f,s){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);if(f){c.fillStyle=f;c.fill()}if(s){c.strokeStyle=s;c.lineWidth=.7;c.stroke()}}
function lgv(c,y0,y1,a,b,d){const q=c.createLinearGradient(0,y0,0,y1);q.addColorStop(0,a);q.addColorStop(.45,b);q.addColorStop(1,d);return q}

/* ================= world (300 x 300 m) ================= */
const MAP=150,CELL=6,grid=new Map(),posts=[];

function nJoin(code){
  if(RELAY.indexOf('YOUR-APP')>=0){nSet('ยังไม่ได้ตั้งค่าเซิร์ฟเวอร์ออนไลน์ในไฟล์ (ตัวแปร RELAY)');return}

  ws.onmessage=e=>{
    let d;try{d=JSON.parse(e.data)}catch(x){return}
    if(d.t==='joined'){nSet('เข้าห้อง '+code+' แล้ว กดเริ่มภารกิจเพื่อให้เพื่อนเห็นคุณ')}

function loop(t){
  if(QF&&t-last<QF-2){requestAnimationFrame(loop);return}
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(running){update(dt);render(t)}else if(lobbyOn)lobbyDraw(t/1000);
  requestAnimationFrame(loop);
}

function airStart(){windStop();air={ph:1,t:0,t2:0,open:false,jr:0,px:rnd(-40,40),pz:rnd(-110,-25),snd:0};document.body.classList.remove('a1','a2','jr');airSnd(0)}
function airSnd(kind){if(!kind&&!AIRSND)return;const a=ac();if(!a)return;try{if(AIRSND){try{AIRSND.s.stop()}catch(e){}AIRSND=null}if(!kind)return;const s=a.createBufferSource(),f=a.createBiquadFilter(),gn=a.createGain(),pl=kind==='plane';s.buffer=nbuf(a);s.loop=true;f.type=pl?'lowpass':'bandpass';f.frequency.value=pl?190:900;f.Q.value=.6;gn.gain.value=pl?.5:.14;s.connect(f);f.connect(gn);gn.connect(a.destination);s.start();AIRSND={s,gn}}catch(e){}}

  nz(a,t,.12,'highpass',1800,.6,.5,1);

  s.buffer=nbuf(a);s.loop=true;f.type='bandpass';f.frequency.value=700;f.Q.value=.5;gn.gain.value=0;
  s.connect(f);f.connect(gn);gn.connect(a.destination);s.start();WIND={s,gn}}catch(e){}}

function doJump(){if(air.ph!==1||air.t<20)return;const c=document.body.classList;air.ph=2;air.t2=0;air.open=false;c.remove('a1','jr');c.add('a2');P.x=air.px;P.z=air.pz;P.y=130;P.vy=-2;P.yaw=rnd(0,6.28);P.pitch=0;banner('โดด!',1200);airSnd('wind');windStart();windSet(.06);noise(.3,1200,.35);thump(200,60,.25,.45)}
function airUpd(dt){const c=document.body.classList;
  if(!air.snd){air.snd=1;c.add('a1');airSnd('plane');banner('กำลังบินเหนือสวนยาง...',2500)}
  if(air.ph===1){air.t+=dt;if(air.t>=20&&!air.jr){air.jr=1;c.add('jr');banner('ถึงจุดโดดแล้ว!',2000);thump(900,600,.1,.2)}if(air.t>=34)doJump();return}
  air.t2+=dt;const ys=Math.sin(P.yaw),yc=Math.cos(P.yaw);
  let fi=-jy+((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0),si=jx+((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0);const l=Math.hypot(fi,si);if(l>1){fi/=l;si/=l}
  const sp=air.open?7:3;P.x=clamp(P.x+(ys*fi+yc*si)*sp*dt,-MAP+4,MAP-4);P.z=clamp(P.z+(yc*fi-ys*si)*sp*dt,-MAP+4,MAP-4);
  if(!air.open){P.vy=Math.max(-30,P.vy-20*dt);if(air.t2>1.8||P.y<45){air.open=true;banner('กางร่ม!',1500);chuteOpenSnd()}}
  else P.vy+=(-5.5-P.vy)*Math.min(1,dt*2.5);
  P.y+=P.vy*dt;
  if(WIND)windSet(air.open?.05+Math.min(.1,-P.vy*.01):Math.min(.25,.05+(-P.vy)*.008));
  if(P.y<=0){P.y=0;P.vy=0;air.ph=0;c.remove('a1','a2','jr');airSnd(0);banner('ลงพื้นแล้ว! เตรียมรับมือซอมบี้',2500);shk=.6;landSnd();windStop();P.pitch=0;waveWait=2.5;push(P,.35)}}
function drawPlane(t){g.save();g.translate(rnd(-1,1)*2,rnd(-1,1)*2);
  let q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,'#04070e');q.addColorStop(.55,'#10252b');q.addColorStop(1,'#1a2a1c');g.fillStyle=q;g.fillRect(-6,-6,W+12,H+12);
  for(const s of stars){const x=((s.a/Math.PI*.5+.5)*W+t*.004*s.s)%W,y=s.h*H*.5;g.globalAlpha=.4+.5*Math.sin(t/600+s.p);g.fillStyle='#fff';g.fillRect(x,y,s.s,s.s)}g.globalAlpha=1;
  for(let i=0;i<7;i++){const x=(((i*211-t*(.18+i*.05))%(W+300))+W+300)%(W+300)-150,y=H*(.12+(i*.37%1)*.4);g.fillStyle='rgba(180,200,205,'+(.05+i%3*.03)+')';g.beginPath();g.ellipse(x,y,90+i*14,12+i*2,0,0,6.283);g.fill()}

  const ok=air.t>=20,m=Math.min(W,H);g.fillStyle=ok?'#33e070':(Math.sin(t/260)>0?'#ff3a2a':'#5a1410');g.beginPath();g.arc(W/2,H*.05,Math.max(8,H*.02),0,6.283);g.fill();
  g.textAlign='center';g.fillStyle='#e8f0ea';g.font='800 '+Math.round(m*.06)+'px K2D,Tahoma,sans-serif';g.fillText(ok?'ถึงจุดโดดแล้ว!':'กำลังบินเหนือสวนยาง...',W/2,H*.22);
  g.font='400 '+Math.round(m*.042)+'px Sarabun,Tahoma,sans-serif';g.fillStyle='#f0b44a';g.fillText(ok?'กดปุ่มโดดร่มเพื่อลงพื้นที่':'ถึงจุดโดดใน '+Math.ceil(20-air.t)+' วินาที',W/2,H*.22+m*.08);
  q=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.95);q.addColorStop(0,'rgba(0,0,0,0)');q.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=q;g.fillRect(-6,-6,W+12,H+12);g.restore()}
function drawAerial(t){const alt=P.y,tilt=-.85*clamp((alt-14)/50,0,1),ph=clamp(P.pitch+tilt,-1.45,.45),cp=Math.cos(ph),sp=Math.sin(ph),yh=H/2+F*Math.tan(ph);
  let q;g.fillStyle='#1a2a1b';g.fillRect(0,0,W,H);
  if(yh>0){q=g.createLinearGradient(0,0,0,yh);q.addColorStop(0,'#04070e');q.addColorStop(1,'#14292e');g.fillStyle=q;g.fillRect(0,0,W,Math.min(yh,H))}
  if(yh<H){q=g.createLinearGradient(0,yh,0,yh+F*.8);q.addColorStop(0,'#14292e');q.addColorStop(1,'#1a2a1b');g.fillStyle=q;g.fillRect(0,Math.max(0,yh),W,H)}
  /* มองแบบ 3D หมุนซ้าย-ขวา (yaw) และก้ม-เงย (pitch) ได้ */
  const pr=(dx,dz,h)=>{const f=dx*SN+dz*CS,r=dx*CS-dz*SN,zc=f*cp+h*sp;if(zc<.8)return null;const yc=h*cp-f*sp,s=F/zc;return[W/2+r*s,H/2-yc*s,s,zc]};
  const R=Math.min(130,60+70*QV),L=[];
  eachNear(R,p=>{if(p.k!==0)return;const o=pr(p.x-CX,p.z-CZ,p.h-alt);if(!o||o[0]<-60||o[0]>W+60||o[1]<-60||o[1]>H+60)return;o.p=p;L.push(o)});
  L.sort((a,b)=>b[3]-a[3]);
  for(const o of L){const p=o.p,s=o[2],rad=Math.max(1.5,1.8*s);
    if(QL>0){const gb=pr(p.x-CX,p.z-CZ,-alt);if(gb){g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(gb[0],gb[1],rad*.9,rad*.45,0,0,6.283);g.fill();g.strokeStyle='rgb(60,40,26)';g.lineWidth=Math.max(1,.25*s);g.beginPath();g.moveTo(gb[0],gb[1]);g.lineTo(o[0],o[1]);g.stroke()}}

  q=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.9);q.addColorStop(0,'rgba(0,0,0,0)');q.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=q;g.fillRect(0,0,W,H);
  g.textAlign='center';g.fillStyle='#fff';g.font='800 18px K2D,Tahoma,sans-serif';g.fillText('ความสูง '+Math.round(alt)+' ม.',W/2,40)}
function drawChute(t){if(!air.open)return;const cx=W/2+Math.sin(t/900)*W*.012,rx=Math.min(W*.46,F*.9),ry=H*.25,cy=H*.2;
  g.save();g.beginPath();g.ellipse(cx,cy,rx,ry,0,Math.PI,0);g.closePath();g.clip();
